packages:
  - 'packages/*'
  - 'apps/*'

# Supply-chain baseline from cteic/foundry docs/install-policy.md.

# Refuse releases younger than 3 days, the same wait Renovate uses.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@cteic/*'
minimumReleaseAgeStrict: true

# Fail the install when a dependency has an install script nobody approved.
strictDepBuilds: true

# Fail the install when a release has weaker provenance than earlier ones.
trustPolicy: no-downgrade
# Each entry below is an old release that was already in the lockfile. Newer
# releases of the same package ship with provenance, so pnpm reads these as a
# trust downgrade. Publish dates are from the npm registry.
trustPolicyExclude:
  - '@noble/curves@1.8.0' # published 2025-01-03
  - '@noble/hashes@1.7.0' # published 2025-01-03
  - '@noble/secp256k1@1.7.2' # 1.x line, published 2025-04-14
  # 9.1.2 is the maintainer's clean release after the July 2025 takeover of
  # 9.1.1. It was published 3 hours later, and 9.1.1 is no longer on npm.
  - 'eslint-config-prettier@9.1.2'
  - 'jose@4.15.9' # 4.x line, published 2024-07-03
  - 'semver@5.7.2 || 6.3.1' # 5.x and 6.x lines, published 2023-07-10
  - 'tailwind-merge@2.6.1' # 2.x line, published 2026-01-30
  - 'ua-parser-js@1.0.41' # 1.x line, published 2025-08-19
  - 'undici-types@6.21.0' # 6.x line, published 2024-11-13
  - 'vite@5.4.21' # 5.x line, published 2025-10-20

# Only direct dependencies may come from git or tarball URLs.
blockExoticSubdeps: true

# Packages allowed to run install scripts. pnpm fails on any other script.
allowBuilds:
  # postinstall checks that the platform binary from @esbuild/* is present and
  # fetches it if the optional dependency was skipped. Used by Vite, tsx and wrangler.
  esbuild: true
  # postinstall does the same for the workerd binary that wrangler runs locally.
  workerd: true
  # Denied: each script only prints a version or funding notice.
  '@reown/appkit': false
  core-js: false
  protobufjs: false
  # Denied: optional native speedups. Each ships prebuilt binaries that load at
  # runtime, or falls back to pure JS, so compiling at install is not needed.
  bufferutil: false
  keccak: false
  secp256k1: false
  utf-8-validate: false

# Moved from .npmrc. pnpm 11 reads only auth and registry settings there.
autoInstallPeers: true
strictPeerDependencies: false

overrides:
  shell-quote: ^1.11.0
  node-forge: ^1.4.1
  flatted: ^3.4.2
  '@babel/plugin-transform-modules-systemjs': '>=7.29.4'
  ws@>=8.0.0 <8.21.0: 8.21.0
  ws@>=7.0.0 <7.5.11: 7.5.11
  ws@>=6.0.0 <6.2.4: 6.2.4
  form-data@>=4.0.0 <4.0.6: 4.0.6
  hono@<4.12.25: '>=4.12.25'
  tar: ^7.5.19
  '@xmldom/xmldom': ^0.9.12
  fast-uri: ^4.1.4
  postcss: ^8.5.18
  axios: ^1.20.0
  js-yaml: '>=4.3.2 <5.0.0'
  sharp: ^0.35.5
  socket.io-parser: ^4.2.7
  browserslist: ^4.28.7
  brace-expansion@1: ^1.1.20
  brace-expansion@2: ^2.1.6
  brace-expansion@5: ^5.0.11
  nanoid@3: ^3.3.18
  bitcoinjs-lib@6: ^6.1.8
  compression: ^1.8.2
  dompurify: ^3.4.17
  follow-redirects: ^1.16.1
  source-map-js: ^1.2.2
  undici@6: ^6.28.1
  zod@4: ^4.6.6
  decode-uri-component: ^0.5.1
  picomatch@<2.3.2: 2.3.2
  picomatch@>=4.0.0 <4.0.4: 4.0.4

# Baseline allowlist for the CI `pnpm audit --prod --audit-level high` gate.
# Each entry is a high or critical advisory with no fix reachable from our direct
# deps without a major or minor upgrade (deferred to per-package PRs under #69).
# The gate fails the build on any new high or critical, so the baseline can't
# grow silently. Burn this list down as upgrades land. Never add to it to
# silence a fixable advisory.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-mrhx-c7xc-m3w5

packageExtensions:
  next:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  next-themes:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  tamagui:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  '@tamagui/core':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  '@tamagui/web':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true

patchedDependencies:
  query-string@7.1.3: patches/query-string@7.1.3.patch
