name: Bundle size

# Posts a per-route first-load JS table on each pull request, compared with
# the base commit, using the shared workflow from cteic/foundry. The budget
# and the measuring stay in scripts/check-bundle-budget.mjs; foundry only
# builds both commits and posts the comment.
#
# The push trigger stores each dev commit's measurement in the Actions cache,
# so a pull request based on it builds once instead of twice.

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: bundle-size-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  bundle-size:
    permissions:
      contents: read
      pull-requests: write
    # ci/measurement-workflows at cteic/foundry#11. Move to a commit on
    # foundry's dev branch once that pull request merges.
    uses: cteic/foundry/.github/workflows/bundle-size.yml@9d9275fb526b50ad82a9fdf8010e874cde16e2e4
    with:
      build-dir: apps/web/.next
      build-command: pnpm turbo run build --filter=@stackr/web...
      node-version: '22'
      timeout-minutes: 25
